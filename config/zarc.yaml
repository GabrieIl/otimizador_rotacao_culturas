# Zoneamento Agrícola de Risco Climático (MAPA/Embrapa) — tábua de risco em dados abertos.
# Fonte: https://dados.agricultura.gov.br/dataset/tabua-de-risco-zoneamento-agricola-de-risco-climatico
# O CSV é baixado manualmente e guardado sem alteração em data/bronze/zarc/.

arquivo: "dados-abertos-tabua-de-risco-safra-2026-2027.csv"
safra: "2026/2027"
manejo: "Sequeiro"

# Cultura do motor -> Nome_cultura na tábua do ZARC.
# Esta tábua de dados abertos só traz grãos anuais. Fora dela: palma, buffel, fava, mandioca,
# batata-doce, hortaliças e frutas (o ZARC de mandioca e de frutas sai em portarias à parte).
culturas:
  milho_sertanejo: "Milho 1ª Safra"     # CONFERIR
  feijao_caupi: "Feijão Caupi"          # CONFERIR
  sorgo_forrageiro: "Sorgo Forrageiro"  # CONFERIR
  # Feijão comum (Phaseolus). "Feijão 2ª Safra" também existe na tábua (Quixadá e Sousa em sequeiro);
  # qual das duas vale para o plantio das águas no semiárido: REVISAR AGRÔNOMO
  feijao_comum: "Feijão"                # CONFERIR
