# ---------------------------------------------------------------------------
# 6. Solo de referência do semiárido
# A produtividade base de cada cultura (domain/presets.py) representa a roça típica da região.
# O efeito do solo no Monte Carlo é RELATIVO a este perfil típico:
#   fator = índice do solo local / índice do solo de referência.
# Atributo sem dado no local (ex.: fósforo sem análise) usa o valor de referência, ou seja,
# não penaliza nem beneficia, e a tela avisa que foi assumido.
# REVISAR AGRÔNOMO: todos os valores. Base qualitativa: "solos do Semiárido, arenosos e de
# baixa fertilidade" (Embrapa, Nutrição mineral, calagem e adubação da palma forrageira).
# ---------------------------------------------------------------------------
solo_referencia:
  argila_pct: 15.0
  areia_pct: 70.0
  mo_pct: 1.0
  ph_h2o: 6.0
  p_mehlich: 12.0     # com 15% de argila = classe "baixo" (Alvarez V. et al., 1999)
  k_mg_dm3: 60.0
  v_pct: 60.0
  ctc_t: 5.0
  declividade_pct: 3.0
fator_solo_limites: [0.40, 1.25]   # REVISAR AGRÔNOMO: limites do fator relativo no Monte Carlo

# ---------------------------------------------------------------------------
# 7. Nitrogênio disponível inicial para a cadeia de Markov
# N disponível (kg/ha/ano) ~ MO x fração de N na MO x massa de solo 0-20 cm x taxa de mineralização
# REVISAR AGRÔNOMO: todos
nitrogenio_disponivel:
  fracao_n_na_mo: 0.05          # ~5% de N na matéria orgânica (relação C:N ~11,6)
  densidade_solo_g_cm3: 1.4     # usada se o SoilGrids não trouxer densidade
  profundidade_cm: 20
  taxa_mineralizacao_ano: 0.02  # 1-3% ao ano é a faixa usual em livros-texto

# ---------------------------------------------------------------------------
# 8. Fontes de dados do perfil
# ---------------------------------------------------------------------------
soilgrids:
  # ISRIC SoilGrids 2.0 (250 m): mapas globais feitos com perfis de solo + imagens de satélite.
  url: "https://rest.isric.org/soilgrids/v2.0/properties/query"
  propriedades: ["clay", "sand", "silt", "soc", "nitrogen", "phh2o", "cec", "bdod"]
  # Camada 0-20 cm (a mesma da análise de rotina): pesos em cm de cada profundidade do SoilGrids
  profundidades: {"0-5cm": 5, "5-15cm": 10, "15-30cm": 5}
  timeout_segundos: 90

terreno:
  # Terrain Tiles (Tilezen/Mapzen) no AWS Open Data, formato terrarium; fontes incluem o SRTM.
  url: "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
  zoom: 12            # ~38 m por pixel no equador
  timeout_segundos: 30

# Sensibilidade a saturação por bases (Ca, Mg) por cultura. REVISAR AGRÔNOMO: todos
bases_por_cultura:
  milho_sertanejo: media
  feijao_caupi: media
  sorgo_forrageiro: baixa
  palma_forrageira: alta   # cartilha UFV: exigente em Ca e Mg
  capim_buffel: baixa
  feijao_comum: media   # REVISAR AGRÔNOMO
  fava: media   # REVISAR AGRÔNOMO
  mandioca: baixa   # REVISAR AGRÔNOMO
  batata_doce: media   # REVISAR AGRÔNOMO
  cenoura: media   # REVISAR AGRÔNOMO
  alface: alta   # REVISAR AGRÔNOMO
  rucula: media   # REVISAR AGRÔNOMO
  coentro: media   # REVISAR AGRÔNOMO
  cebolinha: media   # REVISAR AGRÔNOMO
  espinafre: alta   # REVISAR AGRÔNOMO
  rabanete: media   # REVISAR AGRÔNOMO
  tomate: alta   # REVISAR AGRÔNOMO
  pimentao: alta   # REVISAR AGRÔNOMO
  pimenta: media   # REVISAR AGRÔNOMO
  morango: alta   # REVISAR AGRÔNOMO
  maracuja: media   # REVISAR AGRÔNOMO
  mamao: media   # REVISAR AGRÔNOMO
  banana: media   # REVISAR AGRÔNOMO
  limao: media   # REVISAR AGRÔNOMO

# Descrição curta de cada cultura para o card em destaque (página Início).
# REVISAR AGRÔNOMO: textos escritos pela equipe a partir das exigências acima.
descricao_culturas:
  milho_sertanejo: >-
    Cereal de ciclo médio. É a cultura do grupo que mais sente falta de água, principalmente na
    floração, e a que mais pede nitrogênio.
  feijao_caupi: >-
    Leguminosa de ciclo curto. Fixa o próprio nitrogênio com bactérias da raiz, mas precisa de
    fósforo para isso. Aguenta a seca melhor que o milho.
  sorgo_forrageiro: >-
    Cereal resistente à seca: segura o crescimento no veranico e volta a crescer com a chuva.
    Serve para grão e para forragem.
  palma_forrageira: >-
    Cacto forrageiro que guarda água na raquete (cladódio). Não vai bem em solo ácido, salino ou
    encharcado e pede potássio, cálcio e magnésio.
  capim_buffel: >-
    Capim perene muito resistente à seca, usado como pasto no semiárido. Aguenta solo pobre.
  feijao_comum: >-
    Leguminosa de ciclo curto (70-90 dias). Fixa parte do nitrogênio, mas sente mais a seca e o calor na floração que o caupi. Vai bem em consórcio com o milho.
  fava: >-
    Leguminosa rústica, de ciclo mais longo que o feijão. Fixa nitrogênio e aguenta melhor o calor; tradicional em consórcio no Nordeste.
  mandioca: >-
    Raiz muito rústica: perde folha na seca e volta com a chuva. Não precisa ser colhida na hora (fica como reserva na terra). Pede potássio e não gosta de solo encharcado.
  batata_doce: >-
    Rama de ciclo de 4 a 6 meses, rústica e de baixo custo. Prefere solo leve e solto; tolera seca depois de enraizada.
  cenoura: >-
    Raiz de ciclo de 90 a 110 dias. Precisa de solo fofo, sem pedra, e de rega constante para não rachar.
  alface: >-
    Folha de ciclo de 40 a 60 dias, raiz rasa. Pede rega diária, matéria orgânica e sombra nas horas mais quentes.
  rucula: >-
    Folha de ciclo muito curto (cerca de 30 dias), boa para canteiro intensivo e venda na feira.
  coentro: >-
    Tempero de ciclo curto (40 a 60 dias), muito vendido no Nordeste. Tolera calor, mas precisa de rega.
  cebolinha: >-
    Tempero que rebrota depois do corte e dá várias colheitas. Raiz rasa: rega frequente.
  espinafre: >-
    Folha que prefere clima ameno; no semiárido sofre com o calor. Não tolera solo ácido.
  rabanete: >-
    Raiz de ciclo muito curto (cerca de 30 dias). Rega regular para não ficar oco ou rachado.
  tomate: >-
    Fruto de alto valor (cereja e grape rendem bem por m²). Exige rega constante, tutoramento e manejo de pragas; muitas vezes com sombrite.
  pimentao: >-
    Fruto de alto valor por m², com colheitas por vários meses. Sente falta de água e de cálcio.
  pimenta: >-
    Mais rústica que o pimentão e com colheita por meses. Boa para venda e para conserva.
  morango: >-
    Fruto de alto valor, mas pede clima ameno: no semiárido só em altitude ou com estrutura. Raiz muito rasa e rega por gotejo.
  maracuja: >-
    Trepadeira que começa a produzir em menos de um ano e colhe por vários meses. Precisa de espaldeira e de rega no semiárido.
  mamao: >-
    Produz em menos de um ano e colhe o ano inteiro. Não tolera encharcamento; no semiárido, com rega.
  banana: >-
    Pouca manutenção depois de estabelecida e colheita o ano todo, mas consome muita água e potássio.
  limao: >-
    Árvore de vida longa, colhe o ano todo depois de 2 a 3 anos. Tolera alguma seca, mas produz bem com rega.
