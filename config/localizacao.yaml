# Descobrir o município de uma coordenada (para cruzar com o ZARC).

nominatim:
  # Geocodificação reversa do OpenStreetMap. Política de uso: no máximo 1 pedido/s,
  # User-Agent identificando o app e cache das respostas.
  # https://operations.osmfoundation.org/policies/nominatim/
  url: "https://nominatim.openstreetmap.org/reverse"
  user_agent: "acaua-hackathon/0.1 (NASA Space Apps 2026)"
  zoom: 10            # 10 = nível de município
  timeout_segundos: 30

ibge:
  # Lista oficial de municípios por UF (código de 7 dígitos).
  url_municipios: "https://servicodados.ibge.gov.br/api/v1/localidades/estados/{uf}/municipios"
  timeout_segundos: 30

# Caixa aproximada do Brasil, só para avisar coordenada claramente fora.
limites_brasil:
  lat_min: -34.0
  lat_max: 5.5
  lon_min: -74.0
  lon_max: -34.5
