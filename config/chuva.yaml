# Parâmetros do cálculo de atraso da chuva.
# Todos os valores precisam de validação por alguém de agronomia/meteorologia.

# Critério agronômico de início da estação chuvosa (Sivakumar, 1988):
# primeiro dia com chuva acumulada em 3 dias >= chuva_minima_3_dias_mm,
# sem veranico maior que veranico_max_dias nos janela_verificacao_dias seguintes.
inicio_chuva:
  chuva_minima_3_dias_mm: 20.0   # CONFERIR
  dia_chuvoso_mm: 1.0            # CONFERIR: abaixo disso o dia conta como seco
  veranico_max_dias: 7           # CONFERIR
  janela_verificacao_dias: 30    # CONFERIR
  busca_max_dias: 240            # quantos dias após o início do ano hidrológico procurar

# Período de referência (normal climatológica OMM).
referencia:
  ano_inicio: 1991
  ano_fim: 2020

# Fonte da chuva: NASA POWER (PRECTOTCORR, reanálise MERRA-2/GEOS-IT).
nasa_power:
  inicio_historico: "1991-01-01"
  url: "https://power.larc.nasa.gov/api/temporal/daily/point"
  timeout_segundos: 120

# Limite de atraso repassado ao motor Monte Carlo (SimulationConfig aceita 0-45).
atraso_max_motor_dias: 45

# Veranico: dias seguidos sem chuva (dia seco < dia_chuvoso_mm) DEPOIS que a chuva firmou.
# A definição varia na literatura (5, 7, 10 ou 15 dias); ver docs/referencias.md.
veranico:
  dias_minimos: 10              # CONFERIR: a partir de quantos dias secos seguidos conta como veranico
  janela_apos_inicio_dias: 90   # CONFERIR: período da lavoura depois da chuva firmar
  aviso_dias_secos: 5           # na safra em curso, avisar a partir de N dias sem chuva

# Ícone de chuva no calendário, pelo total do dia (fraca abaixo de moderada; forte a partir de forte).
calendario:
  chuva_moderada_mm: 10.0       # CONFERIR
  chuva_forte_mm: 25.0          # CONFERIR
